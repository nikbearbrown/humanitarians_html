<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Collisions Count π: The Configuration Space View</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #FFFFFF;
    color: #2A1A0E;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #2A1A0E;
    text-align: center;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 0.78rem;
    color: #545454;
    text-align: center;
    margin-bottom: 18px;
    font-weight: 600;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #545454;
  }
  select {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 12px;
    border: 2px solid #2A1A0E;
    background: #fff;
    color: #2A1A0E;
    cursor: pointer;
    outline: none;
  }
  button {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 8px 20px;
    border: 2px solid #2A1A0E;
    background: #2A1A0E;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  button:hover { background: #C8102E; border-color: #C8102E; }
  button.running { background: #C8102E; border-color: #C8102E; }
  .panels {
    display: flex;
    gap: 16px;
    width: 100%;
    max-width: 960px;
    align-items: flex-start;
  }
  .panel {
    flex: 1;
    border: 2px solid #D4D4D4;
    background: #fff;
    padding: 10px;
  }
  .panel-title {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #545454;
    margin-bottom: 8px;
    text-align: center;
  }
  canvas { display: block; }
  .info-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .info-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .info-val {
    font-size: 1.6rem;
    font-weight: 900;
    color: #C8102E;
    line-height: 1;
  }
  .info-val.black { color: #2A1A0E; }
  .info-label {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #545454;
  }
  .formula-box {
    margin-top: 12px;
    padding: 10px 16px;
    border: 1.5px solid #D4D4D4;
    background: #FAFAFA;
    text-align: center;
  }
  .formula {
    font-size: 0.9rem;
    font-weight: 700;
    color: #2A1A0E;
  }
  .formula span { color: #C8102E; }
  .pi-digits {
    font-size: 0.75rem;
    font-weight: 600;
    color: #545454;
    margin-top: 4px;
    letter-spacing: 0.04em;
  }
  .pi-digits span { color: #C8102E; font-weight: 900; }
</style>
</head>
<body>

<h1>Block Collisions Count π: The Configuration Space View</h1>
<div class="subtitle">Mass ratio M/m = 10<sup>2k</sup> → Collisions = first k+1 digits of π</div>

<div class="controls">
  <div class="control-group">
    <label>Mass Ratio M/m</label>
    <select id="massSelect">
      <option value="1">1 (M/m = 1, k=0)</option>
      <option value="100" selected>100 (M/m = 10², k=1)</option>
      <option value="10000">10,000 (M/m = 10⁴, k=2)</option>
      <option value="1000000">1,000,000 (M/m = 10⁶, k=3)</option>
    </select>
  </div>
  <div class="control-group">
    <label>Animation</label>
    <button id="startBtn">Run Simulation</button>
  </div>
</div>

<div class="panels">
  <div class="panel">
    <div class="panel-title">Real Space — Block Positions</div>
    <canvas id="realCanvas" width="440" height="300"></canvas>
  </div>
  <div class="panel">
    <div class="panel-title">Configuration Space — Path Tracing</div>
    <canvas id="configCanvas" width="440" height="300"></canvas>
  </div>
</div>

<div class="info-bar">
  <div class="info-item">
    <div class="info-val" id="collCount">0</div>
    <div class="info-label">Collisions</div>
  </div>
  <div class="info-item">
    <div class="info-val black" id="angleVal">—</div>
    <div class="info-label">θ = arctan(√m/M)</div>
  </div>
  <div class="info-item">
    <div class="info-val black" id="floorPiVal">—</div>
    <div class="info-label">⌊π/θ⌋ (predicted)</div>
  </div>
</div>

<div class="formula-box">
  <div class="formula">Collisions = <span>⌊π / θ⌋</span> where θ = arctan(√(m/M))</div>
  <div class="pi-digits" id="piDigits">Counting: <span id="piDisplay">—</span></div>
</div>

<script>
const realCanvas = document.getElementById('realCanvas');
const configCanvas = document.getElementById('configCanvas');
const rCtx = realCanvas.getContext('2d');
const cCtx = configCanvas.getContext('2d');

const BG = '#FFFFFF', INK = '#2A1A0E', RED = '#C8102E', SLATE = '#545454', HAIR = '#D4D4D4';

// State
let massRatio = 100;
let animId = null;
let isRunning = false;
let collisions = 0;
let configPath = []; // points in config space
let stepIndex = 0;
let precomputedSteps = [];

// Physics: config space approach
// Small block pos x1 >= 0 (left wall at x=0), large block pos x2 >= x1
// Config space: X axis = x1 * sqrt(m) = x1, Y axis = x2 * sqrt(M)
// Walls: x1=0 → X=0 (vertical wall), x1=x2 → X/sqrt(m) = Y/sqrt(M) → Y = X*sqrt(M/m) = X*sqrt(R) where R=M/m

function precompute(R) {
  // In config space, we track angle from origin
  // Initial condition: x1 large (block 1 at right), x2 approaching from far right
  // Let's say initial: x1=10 (small block), x2=40 (large block) moving left
  // Config coords: X = x1*sqrt(1) = x1, Y = x2*sqrt(R)
  // Initial velocity in config space: (v1*sqrt(m), v2*sqrt(M)) = (0, -sqrt(R)) [large block moving left]

  const theta = Math.atan(1 / Math.sqrt(R)); // angle of collision mirror from X axis
  const predicted = Math.floor(Math.PI / theta);

  // Simulate analytically in config space
  // Start: position (10, 40*Math.sqrt(R)), velocity (0, -Math.sqrt(R))
  // Scale for display: we'll normalize

  let steps = [];
  // We'll trace the angle
  // Start angle: the ball is moving "down" in config space (negative Y direction)
  // Walls: Y-axis (X=0), and the line Y = X*sqrt(R) (i.e. angle arctan(sqrt(R)) from X axis)

  // Simpler: work in unit circle
  // The "ball" moves at constant speed. Walls are:
  //   Wall 1: X=0 (vertical), reflects vx → -vx
  //   Wall 2: line at angle alpha = arctan(sqrt(R)) from X axis, reflects velocity across this line

  // Start position far from origin, moving at angle 270° (downward, -Y)
  // Use angle parameterization

  let px = 10, py = 40 * Math.sqrt(R);
  let vx = 0, vy = -1; // unit velocity

  // Normalize for display
  const scale = 120 / (40 * Math.sqrt(R));
  steps.push({px: px * scale, py: py * scale, collisions: 0, type: 'start'});

  let colCount = 0;

  for (let i = 0; i < predicted + 2; i++) {
    // Find next wall hit
    // Wall 1: X=0, t = -px/vx (if vx < 0)
    // Wall 2: line Y = X*tan(alpha), or Y - X*tan(alpha) = 0
    //         normal: (-tan(alpha), 1)/|...|
    //         t = (0 - (py - px*tan_alpha)) / (vy - vx*tan_alpha)  [when dot with normal = 0]

    const tan_alpha = Math.sqrt(R);
    let t1 = vx < 0 ? -px / vx : Infinity;

    // Wall 2: py + t*vy = (px + t*vx)*tan_alpha → t*(vy - vx*tan_alpha) = px*tan_alpha - py
    const denom = vy - vx * tan_alpha;
    let t2 = Infinity;
    if (Math.abs(denom) > 1e-12) {
      const t2c = (px * tan_alpha - py) / denom;
      if (t2c > 1e-9) t2 = t2c;
    }

    if (t1 === Infinity && t2 === Infinity) break;

    if (t1 < t2) {
      // Hit wall 1 (X=0): reflect vx
      px = px + t1 * vx;
      py = py + t1 * vy;
      vx = -vx;
      colCount++;
      steps.push({px: px * scale, py: py * scale, collisions: colCount, type: 'wall'});
    } else {
      // Hit wall 2: reflect across the line
      px = px + t2 * vx;
      py = py + t2 * vy;
      // Reflect velocity across line Y = X*tan_alpha
      // Line direction: (1, tan_alpha)/sqrt(1+tan_alpha^2)
      const lx = 1 / Math.sqrt(1 + tan_alpha * tan_alpha);
      const ly = tan_alpha / Math.sqrt(1 + tan_alpha * tan_alpha);
      const dot = vx * lx + vy * ly;
      vx = 2 * dot * lx - vx;
      vy = 2 * dot * ly - vy;
      colCount++;
      steps.push({px: px * scale, py: py * scale, collisions: colCount, type: 'block'});
    }

    if (vx > 0 && vy > 0) break; // both moving away
    if (colCount > predicted + 1) break;
  }

  return { steps, predicted, theta };
}

function getTheta(R) { return Math.atan(1 / Math.sqrt(R)); }

function getPiDigits(R) {
  // R = 10^(2k): k collisions digits
  if (R === 1) return { digits: '3', label: '3 collisions → π starts with 3' };
  if (R === 100) return { digits: '31', label: '31 collisions → π starts with 3.1' };
  if (R === 10000) return { digits: '314', label: '314 collisions → 3.14' };
  if (R === 1000000) return { digits: '3141', label: '3141 collisions → 3.141' };
  return { digits: '?', label: '' };
}

function drawReal(x1Norm, x2Norm, colCount) {
  const W = realCanvas.width, H = realCanvas.height;
  rCtx.clearRect(0, 0, W, H);

  // Floor
  rCtx.strokeStyle = INK;
  rCtx.lineWidth = 2;
  rCtx.beginPath();
  rCtx.moveTo(40, H - 50);
  rCtx.lineTo(W - 20, H - 50);
  rCtx.stroke();

  // Left wall
  rCtx.lineWidth = 4;
  rCtx.beginPath();
  rCtx.moveTo(40, H - 90);
  rCtx.lineTo(40, H - 50);
  rCtx.stroke();

  // Hatching on wall
  rCtx.strokeStyle = HAIR;
  rCtx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    rCtx.beginPath();
    rCtx.moveTo(40, H - 55 - i * 8);
    rCtx.lineTo(30, H - 63 - i * 8);
    rCtx.stroke();
  }

  // Track available width
  const trackStart = 50, trackEnd = W - 30;
  const trackW = trackEnd - trackStart;

  // Small block (red)
  const b1x = trackStart + x1Norm * trackW * 0.35;
  const b1size = 28;
  rCtx.fillStyle = RED;
  rCtx.fillRect(b1x - b1size / 2, H - 50 - b1size, b1size, b1size);
  rCtx.strokeStyle = INK;
  rCtx.lineWidth = 1.5;
  rCtx.strokeRect(b1x - b1size / 2, H - 50 - b1size, b1size, b1size);
  rCtx.fillStyle = '#fff';
  rCtx.font = 'bold 10px Montserrat, sans-serif';
  rCtx.textAlign = 'center';
  rCtx.fillText('m=1', b1x, H - 50 - b1size / 2 + 4);

  // Large block (dark)
  const b2x = trackStart + 60 + x2Norm * trackW * 0.55;
  const b2size = Math.min(52, 28 + Math.log10(massRatio) * 8);
  rCtx.fillStyle = INK;
  rCtx.fillRect(b2x - b2size / 2, H - 50 - b2size, b2size, b2size);
  rCtx.strokeStyle = SLATE;
  rCtx.lineWidth = 1.5;
  rCtx.strokeRect(b2x - b2size / 2, H - 50 - b2size, b2size, b2size);
  rCtx.fillStyle = '#fff';
  rCtx.font = 'bold 9px Montserrat, sans-serif';
  rCtx.textAlign = 'center';
  rCtx.fillText('M=' + massRatio, b2x, H - 50 - b2size / 2 + 4);

  // Arrow showing large block approaching
  if (stepIndex === 0) {
    rCtx.strokeStyle = SLATE;
    rCtx.lineWidth = 2;
    rCtx.beginPath();
    rCtx.moveTo(b2x + b2size / 2 + 30, H - 50 - b2size / 2);
    rCtx.lineTo(b2x + b2size / 2 + 5, H - 50 - b2size / 2);
    rCtx.stroke();
    // arrowhead
    rCtx.beginPath();
    rCtx.moveTo(b2x + b2size / 2 + 5, H - 50 - b2size / 2);
    rCtx.lineTo(b2x + b2size / 2 + 12, H - 50 - b2size / 2 - 5);
    rCtx.lineTo(b2x + b2size / 2 + 12, H - 50 - b2size / 2 + 5);
    rCtx.closePath();
    rCtx.fillStyle = SLATE;
    rCtx.fill();
  }

  // Collision counter
  rCtx.fillStyle = RED;
  rCtx.font = 'bold 28px Montserrat, sans-serif';
  rCtx.textAlign = 'left';
  rCtx.fillText(colCount, 55, 40);
  rCtx.fillStyle = INK;
  rCtx.font = '700 11px Montserrat, sans-serif';
  rCtx.fillText('COLLISIONS', 55, 56);

  // Labels
  rCtx.fillStyle = SLATE;
  rCtx.font = '600 10px Montserrat, sans-serif';
  rCtx.textAlign = 'center';
  rCtx.fillText('LEFT WALL', 40, H - 35);
  rCtx.fillText('frictionless floor →', W / 2, H - 30);
}

function drawConfig(path, R) {
  const W = configCanvas.width, H = configCanvas.height;
  cCtx.clearRect(0, 0, W, H);

  const margin = 40;
  const plotW = W - margin - 20;
  const plotH = H - margin - 20;
  const originX = margin, originY = H - margin;

  // Axes
  cCtx.strokeStyle = INK;
  cCtx.lineWidth = 1.5;
  cCtx.beginPath();
  cCtx.moveTo(originX, originY + 10);
  cCtx.lineTo(originX, margin);
  cCtx.stroke();
  cCtx.beginPath();
  cCtx.moveTo(originX - 10, originY);
  cCtx.lineTo(W - 10, originY);
  cCtx.stroke();

  // Axis labels
  cCtx.fillStyle = INK;
  cCtx.font = '600 10px Montserrat, sans-serif';
  cCtx.textAlign = 'center';
  cCtx.fillText('x₁√m (small block pos)', originX + plotW / 2, H - 5);
  cCtx.save();
  cCtx.translate(12, originY - plotH / 2);
  cCtx.rotate(-Math.PI / 2);
  cCtx.fillText('x₂√M (large block pos)', 0, 0);
  cCtx.restore();

  // Mirror 1: vertical line at X=0 (left wall collision)
  cCtx.strokeStyle = RED;
  cCtx.lineWidth = 2;
  cCtx.setLineDash([4, 3]);
  cCtx.beginPath();
  cCtx.moveTo(originX, originY);
  cCtx.lineTo(originX, margin);
  cCtx.stroke();

  // Mirror 2: line Y = X * sqrt(R) (block-block collision)
  const slopeAngle = Math.atan(Math.sqrt(R));
  const mirrorEndX = plotW * Math.cos(slopeAngle) * 0.7;
  const mirrorEndY = plotW * Math.sin(slopeAngle) * 0.7;
  cCtx.strokeStyle = '#2A6EBB';
  cCtx.lineWidth = 2;
  cCtx.setLineDash([4, 3]);
  cCtx.beginPath();
  cCtx.moveTo(originX, originY);
  cCtx.lineTo(originX + mirrorEndX, originY - mirrorEndY);
  cCtx.stroke();
  cCtx.setLineDash([]);

  // Mirror labels
  cCtx.fillStyle = RED;
  cCtx.font = 'bold 9px Montserrat, sans-serif';
  cCtx.textAlign = 'left';
  cCtx.fillText('Wall', originX + 4, margin + 20);
  cCtx.fillStyle = '#2A6EBB';
  cCtx.textAlign = 'center';
  const lx = originX + mirrorEndX * 0.5 + 8, ly = originY - mirrorEndY * 0.5 - 8;
  cCtx.fillText('Blocks collide', lx, ly);

  // Angle arc
  if (R > 1) {
    const theta = Math.atan(1 / Math.sqrt(R));
    cCtx.strokeStyle = '#888';
    cCtx.lineWidth = 1;
    cCtx.beginPath();
    cCtx.arc(originX, originY, 28, -Math.PI / 2 - theta, -Math.PI / 2);
    cCtx.stroke();
    cCtx.fillStyle = SLATE;
    cCtx.font = '600 9px Montserrat, sans-serif';
    cCtx.textAlign = 'left';
    cCtx.fillText('θ', originX + 6, originY - 30);
  }

  // Draw path
  if (path.length < 2) return;

  // Scale path to plot area
  const maxX = Math.max(...path.map(p => p.px)) * 1.1;
  const maxY = Math.max(...path.map(p => p.py)) * 1.1;
  const scaleX = plotW / (maxX || 1);
  const scaleY = plotH / (maxY || 1);
  const sc = Math.min(scaleX, scaleY) * 0.85;

  const toCanvasX = (px) => originX + px * sc;
  const toCanvasY = (py) => originY - py * sc;

  cCtx.strokeStyle = INK;
  cCtx.lineWidth = 1.5;
  cCtx.beginPath();
  cCtx.moveTo(toCanvasX(path[0].px), toCanvasY(path[0].py));
  for (let i = 1; i < path.length; i++) {
    cCtx.lineTo(toCanvasX(path[i].px), toCanvasY(path[i].py));
  }
  cCtx.stroke();

  // Draw bounce points
  for (let i = 1; i < path.length; i++) {
    const cx = toCanvasX(path[i].px), cy = toCanvasY(path[i].py);
    cCtx.fillStyle = path[i].type === 'wall' ? RED : '#2A6EBB';
    cCtx.beginPath();
    cCtx.arc(cx, cy, 3, 0, Math.PI * 2);
    cCtx.fill();
  }

  // Current position (last point)
  const last = path[path.length - 1];
  const lx2 = toCanvasX(last.px), ly2 = toCanvasY(last.py);
  cCtx.fillStyle = RED;
  cCtx.beginPath();
  cCtx.arc(lx2, ly2, 5, 0, Math.PI * 2);
  cCtx.fill();
}

function updateInfoDisplay(colCount, R) {
  const theta = getTheta(R);
  const predicted = Math.floor(Math.PI / theta);
  const thetaDeg = (theta * 180 / Math.PI).toFixed(3);
  document.getElementById('collCount').textContent = colCount;
  document.getElementById('angleVal').textContent = thetaDeg + '°';
  document.getElementById('floorPiVal').textContent = predicted;
  const { digits, label } = getPiDigits(R);
  document.getElementById('piDisplay').textContent = digits;
  document.getElementById('piDigits').innerHTML = `<span style="color:#2A1A0E">π digits: </span><span>${digits}</span> — ${label}`;
}

function runAnimation() {
  const result = precompute(massRatio);
  precomputedSteps = result.steps;
  stepIndex = 0;
  collisions = 0;
  configPath = [];

  if (precomputedSteps.length > 0) {
    configPath.push(precomputedSteps[0]);
  }

  // Animate steps
  let lastTime = 0;
  const delay = massRatio <= 100 ? 180 : 40; // faster for large ratios

  function tick(ts) {
    if (!isRunning) return;
    if (ts - lastTime < delay) {
      animId = requestAnimationFrame(tick);
      return;
    }
    lastTime = ts;

    if (stepIndex < precomputedSteps.length - 1) {
      stepIndex++;
      const step = precomputedSteps[stepIndex];
      configPath.push(step);
      collisions = step.collisions;

      const x1Norm = 1 - stepIndex / precomputedSteps.length;
      const x2Norm = 0.8 - stepIndex / precomputedSteps.length * 0.6;
      drawReal(Math.max(0, x1Norm), Math.max(0.1, x2Norm), collisions);
      drawConfig(configPath, massRatio);
      updateInfoDisplay(collisions, massRatio);

      animId = requestAnimationFrame(tick);
    } else {
      // Done
      isRunning = false;
      document.getElementById('startBtn').textContent = 'Run Again';
      document.getElementById('startBtn').classList.remove('running');
    }
  }

  animId = requestAnimationFrame(tick);
}

function reset() {
  if (animId) cancelAnimationFrame(animId);
  isRunning = false;
  collisions = 0;
  configPath = [];
  stepIndex = 0;
  drawReal(0.5, 0.9, 0);
  drawConfig([], massRatio);
  updateInfoDisplay(0, massRatio);
}

document.getElementById('massSelect').addEventListener('change', function() {
  massRatio = parseInt(this.value);
  reset();
  document.getElementById('startBtn').textContent = 'Run Simulation';
});

document.getElementById('startBtn').addEventListener('click', function() {
  if (isRunning) {
    cancelAnimationFrame(animId);
    isRunning = false;
    this.textContent = 'Continue';
    this.classList.remove('running');
  } else {
    isRunning = true;
    this.textContent = 'Pause';
    this.classList.add('running');
    if (stepIndex === 0 || stepIndex >= precomputedSteps.length - 1) {
      reset();
      isRunning = true;
      this.textContent = 'Pause';
      this.classList.add('running');
      runAnimation();
    } else {
      runAnimation();
    }
  }
});

// Init
drawReal(0.5, 0.9, 0);
drawConfig([], massRatio);
updateInfoDisplay(0, massRatio);
</script>
</body>
</html>
