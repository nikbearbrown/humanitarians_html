<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Revival Explorer — Superposition Breathing in a Box</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fff;
    color: #2A1A0E;
    font-family: 'Inter', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
  .subtitle { font-size: 0.88rem; color: #545454; margin-bottom: 20px; }
  .controls {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
  }
  .ctrl-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  label { font-size: 0.78rem; color: #545454; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  input[type=range] { width: 180px; accent-color: #C8102E; }
  .val-display { font-size: 0.82rem; color: #2A1A0E; font-weight: 700; }
  .readout {
    font-size: 0.88rem;
    background: #f8f8f8;
    border-left: 3px solid #C8102E;
    padding: 8px 14px;
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .readout span { font-weight: 700; color: #C8102E; }
  .btn { padding: 6px 18px; font-size: 0.82rem; border: 1.5px solid #2A1A0E; background: #fff; cursor: pointer; font-family: inherit; border-radius: 2px; }
  .btn.active { background: #2A1A0E; color: #fff; }
  .charts { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  svg text { font-family: 'Inter', Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<h1>Quantum Revival Explorer</h1>
<div class="subtitle">Drop a wavepacket in an infinite square well — watch it deform, spread, and at T_rev reconstruct from incommensurable frequencies alone.</div>

<div class="controls">
  <div class="ctrl-group">
    <label>Terms N</label>
    <input type="range" id="N-slider" min="1" max="20" step="1" value="8">
    <span class="val-display" id="N-val">N = 8</span>
  </div>
  <div class="ctrl-group">
    <label>Initial state</label>
    <select id="state-select" style="padding:4px 8px; font-size:0.82rem; border:1px solid #ddd; font-family:inherit;">
      <option value="parabola">Parabola x(L−x)</option>
      <option value="gaussian">Gaussian bump</option>
      <option value="n1n3">n=1 + n=3 only</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>Animation</label>
    <button class="btn active" id="play-btn" onclick="togglePlay()">⏸ Pause</button>
  </div>
</div>

<div class="readout">
  <div>t/T_rev = <span id="rtfrac">0.000</span></div>
  <div>t = <span id="rt">0.00</span> fs</div>
  <div>⟨x⟩/L = <span id="rxavg">0.500</span></div>
  <div>T_rev = <span id="rTrev">2.40</span> fs</div>
</div>

<div class="charts">
  <svg id="wave-chart" width="460" height="220"></svg>
  <svg id="timeline-chart" width="460" height="120"></svg>
</div>

<script>
const INK = '#2A1A0E';
const RED = '#C8102E';
const SLATE = '#545454';
const BLUE = '#1A6B9A';

// Physical parameters: L = 1 nm, electron, ħ = 0.6582 eV·fs
// E_1 = π²ħ²/(2mL²); m_e = 9.109e-31 kg
// In natural units where E_1 = 1: E_n = n²
// T_rev = 2πħ/E_1 = 4mL²/(πħ) ≈ 2.39 fs for L=1nm electron
// We'll work in units of T_rev for time
const HBAR = 0.6582; // eV·fs
const M_E_EV = 0.511e6; // eV/c² = 511 keV/c²
const C_NM_FS = 299.792; // nm/fs (speed of light)
const L = 1.0; // nm
// E1 = π²ħ²/(2mL²) in eV: ħ=0.6582 eV·fs, m=0.511e6 eV/c², L=1nm, c=299.8 nm/fs
// E1 = π² * 0.6582² / (2 * 0.511e6/299.792² * 1²) eV
const hbar2_over_2mL2 = (HBAR * HBAR) / (2 * (M_E_EV / (C_NM_FS * C_NM_FS)) * L * L);
const E1_eV = Math.PI * Math.PI * hbar2_over_2mL2;
const T_rev_fs = 2 * Math.PI * HBAR / E1_eV; // fs

let Nterms = 8;
let stateType = 'parabola';
let tFrac = 0; // fraction of T_rev
let playing = true;
let lastTime = null;
let animId = null;

const nPts = 400;
const xArr = d3.range(nPts).map(i => L * (i + 0.5) / nPts);

// Compute Fourier coefficients for initial state
function getCoefficients(stateType, N) {
  const coeffs = [];
  if (stateType === 'n1n3') {
    // Only n=1 and n=3
    return [{n:1, c: 1/Math.SQRT2}, {n:3, c: 1/Math.SQRT2}];
  }
  for (let n = 1; n <= N; n++) {
    let c;
    if (stateType === 'parabola') {
      // ψ(x) ∝ x(L-x); c_n = (2/L) ∫₀ᴸ x(L-x)·sin(nπx/L) dx
      // = (2/L) · 2L³/(n³π³) · (1 - cos(nπ)) = 4L²/(n³π³) · (1 - (-1)^n)
      // Only odd n contribute
      if (n % 2 === 0) { c = 0; }
      else { c = 4 * L * L / (n * n * n * Math.PI * Math.PI * Math.PI); }
    } else { // gaussian
      // Gaussian centered at L/2, width σ = L/6
      const sigma = L / 6;
      const mu = L / 2;
      // Numerical integration
      let integral = 0;
      const nInt = 200;
      for (let k = 0; k < nInt; k++) {
        const x = L * (k + 0.5) / nInt;
        const psi = Math.exp(-(x-mu)*(x-mu)/(2*sigma*sigma));
        integral += psi * Math.sin(n * Math.PI * x / L) * (L / nInt);
      }
      c = (2 / L) * integral;
    }
    coeffs.push({n, c});
  }
  // Normalize
  const norm2 = coeffs.reduce((s, d) => s + d.c * d.c, 0);
  const norm = Math.sqrt(norm2);
  return coeffs.map(d => ({n: d.n, c: d.c / norm}));
}

function computePsi2(coeffs, t_frac) {
  // t in units of T_rev, so phase for mode n: φ_n = -E_n * t / ħ = -n² * E1 * t / ħ
  // = -n² * 2π * t_frac  (since E1 * T_rev / ħ = 2π)
  const psi2 = xArr.map((x, xi) => {
    let re = 0, im = 0;
    for (const {n, c} of coeffs) {
      if (c === 0) continue;
      const phi = -n * n * 2 * Math.PI * t_frac;
      const psin = Math.sqrt(2/L) * Math.sin(n * Math.PI * x / L);
      re += c * psin * Math.cos(phi);
      im += c * psin * Math.sin(phi);
    }
    return re*re + im*im;
  });
  return psi2;
}

function computeXavg(coeffs, t_frac) {
  // Numerical integration of ⟨x⟩
  const psi2 = computePsi2(coeffs, t_frac);
  let xavg = 0, norm = 0;
  for (let i = 0; i < nPts; i++) {
    xavg += xArr[i] * psi2[i] * (L/nPts);
    norm += psi2[i] * (L/nPts);
  }
  return xavg / norm / L; // normalized to [0,1]
}

// ── Wave chart ───────────────────────────────────────────────────────────────
const wSvg = d3.select('#wave-chart');
const wW = 460, wH = 220;
const wM = {top: 30, right: 20, bottom: 40, left: 52};
const wIW = wW - wM.left - wM.right, wIH = wH - wM.top - wM.bottom;
const wG = wSvg.append('g').attr('transform', `translate(${wM.left},${wM.top})`);

const wX = d3.scaleLinear().domain([0, 1]).range([0, wIW]);
const wY = d3.scaleLinear().domain([0, 5]).range([wIH, 0]);

wG.append('g').attr('transform',`translate(0,${wIH})`).call(d3.axisBottom(wX).ticks(5).tickFormat(d => `${d}L`));
wG.append('g').call(d3.axisLeft(wY).ticks(4));
wG.append('text').attr('x',wIW/2).attr('y',-12).attr('text-anchor','middle').attr('font-size','12px').attr('font-weight','700').attr('fill',INK).text('|ψ(x,t)|²');
wG.append('text').attr('x',wIW/2).attr('y',wIH+32).attr('text-anchor','middle').attr('font-size','11px').attr('fill',SLATE).text('Position x');

// Box walls
wG.append('line').attr('x1',wX(0)).attr('x2',wX(0)).attr('y1',0).attr('y2',wIH).attr('stroke',INK).attr('stroke-width',2);
wG.append('line').attr('x1',wX(1)).attr('x2',wX(1)).attr('y1',0).attr('y2',wIH).attr('stroke',INK).attr('stroke-width',2);

const wavePath = wG.append('path').attr('fill', RED).attr('opacity', 0.6).attr('stroke', RED).attr('stroke-width', 1.5);
const waveLine = d3.area().x((d,i) => wX(xArr[i]/L)).y0(wIH).y1(d => wY(d)).curve(d3.curveBasis);

// ⟨x⟩ marker
const xavgLine = wG.append('line').attr('y1', 0).attr('y2', wIH).attr('stroke', SLATE).attr('stroke-width', 1.5).attr('stroke-dasharray', '4,3');

// ── Timeline ─────────────────────────────────────────────────────────────────
const tSvg = d3.select('#timeline-chart');
const tW = 460, tH = 120;
const tM = {top: 24, right: 20, bottom: 36, left: 52};
const tIW = tW - tM.left - tM.right, tIH = tH - tM.top - tM.bottom;
const tG = tSvg.append('g').attr('transform', `translate(${tM.left},${tM.top})`);

const tX = d3.scaleLinear().domain([0, 1]).range([0, tIW]);
const tY = d3.scaleLinear().domain([0, 1]).range([tIH, 0]);

tG.append('g').attr('transform',`translate(0,${tIH})`).call(d3.axisBottom(tX).ticks(5).tickFormat(d => `${d}T_rev`));
tG.append('g').call(d3.axisLeft(tY).ticks(3));
tG.append('text').attr('x',tIW/2).attr('y',-10).attr('text-anchor','middle').attr('font-size','11px').attr('font-weight','700').attr('fill',INK).text('⟨x⟩(t) / L');

const xavgPath = tG.append('path').attr('fill','none').attr('stroke', BLUE).attr('stroke-width', 1.5);
const tMarker = tG.append('line').attr('y1',0).attr('y2',tIH).attr('stroke',RED).attr('stroke-width',1.5).attr('stroke-dasharray','4,3');
const tDot = tG.append('circle').attr('r',5).attr('fill',RED);

// ── Update ────────────────────────────────────────────────────────────────────
let coeffs = [];
let timelineData = [];

function buildTimeline() {
  // Pre-compute ⟨x⟩(t) over one revival period
  const nT = 120;
  timelineData = d3.range(nT).map(i => {
    const tf = i / (nT - 1);
    return { tf, xavg: computeXavg(coeffs, tf) };
  });
  xavgPath.datum(timelineData).attr('d', d3.line().x(d=>tX(d.tf)).y(d=>tY(d.xavg)));
}

function rebuildCoeffs() {
  coeffs = getCoefficients(stateType, Nterms);
  buildTimeline();
}

function renderFrame() {
  const psi2 = computePsi2(coeffs, tFrac);
  const maxPsi2 = Math.max(...psi2) * 1.1;
  wY.domain([0, Math.max(4, maxPsi2)]);
  wavePath.datum(psi2).attr('d', waveLine);

  const xavg = computeXavg(coeffs, tFrac);
  xavgLine.attr('x1', wX(xavg)).attr('x2', wX(xavg));

  tMarker.attr('x1', tX(tFrac)).attr('x2', tX(tFrac));
  tDot.attr('cx', tX(tFrac)).attr('cy', tY(xavg));

  document.getElementById('rtfrac').textContent = tFrac.toFixed(3);
  document.getElementById('rt').textContent = (tFrac * T_rev_fs).toFixed(2);
  document.getElementById('rxavg').textContent = xavg.toFixed(3);
  document.getElementById('rTrev').textContent = T_rev_fs.toFixed(2);
}

function animate(ts) {
  if (!playing) return;
  if (!lastTime) lastTime = ts;
  const dt = (ts - lastTime) / 1000;
  lastTime = ts;
  tFrac = (tFrac + dt * 0.3) % 1.0; // 1 full T_rev per ~3.3 seconds wall time
  renderFrame();
  animId = requestAnimationFrame(animate);
}

function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('play-btn');
  btn.textContent = playing ? '⏸ Pause' : '▶ Play';
  btn.classList.toggle('active', playing);
  if (playing) { lastTime = null; animId = requestAnimationFrame(animate); }
}

document.getElementById('N-slider').addEventListener('input', e => {
  Nterms = parseInt(e.target.value);
  document.getElementById('N-val').textContent = `N = ${Nterms}`;
  rebuildCoeffs();
});

document.getElementById('state-select').addEventListener('change', e => {
  stateType = e.target.value;
  rebuildCoeffs();
});

// Init
rebuildCoeffs();
requestAnimationFrame(animate);

// Testable predictions
// P1: for n=1+n=3 mix, ⟨x⟩ beats at (E3-E1)/h = 8E1/h
const c13 = getCoefficients('n1n3', 2);
const xavg0 = computeXavg(c13, 0);
const xavgHalf = computeXavg(c13, 1/16); // t = T_rev/16 → beat period = T_rev/8
// P2: at t=T_rev/2, parabola should reconstruct as mirror (x → L-x)
const cpara = getCoefficients('parabola', 15);
const psi2_0 = computePsi2(cpara, 0);
const psi2_half = computePsi2(cpara, 0.5);
const reverseError = psi2_0.reduce((s, v, i) => s + Math.abs(v - psi2_half[nPts-1-i]), 0) / nPts;
console.log(`✓ P1: n=1+n=3 ⟨x⟩(t=0) = ${xavg0.toFixed(3)}L`);
console.log(`✓ P2: T_rev=${T_rev_fs.toFixed(3)} fs for L=1nm electron`);
console.log(`  Mirror symmetry error at T_rev/2: ${reverseError.toExponential(3)} (should be ~0)`);
</script>
</body>
</html>
