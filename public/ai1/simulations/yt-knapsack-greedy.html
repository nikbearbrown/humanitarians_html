<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greedy Knapsack: The 50% Guarantee</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #FFFFFF;
    font-family: 'Montserrat', sans-serif;
    color: #2A1A0E;
    width: 900px;
    min-height: 550px;
    padding: 16px;
  }
  h1 {
    font-size: 17px;
    font-weight: 700;
    color: #2A1A0E;
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }
  .main-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .left-panel { width: 430px; flex-shrink: 0; }
  .right-panel { flex: 1; }
  .knapsack-label {
    font-size: 11px;
    font-weight: 600;
    color: #545454;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .capacity-bar-wrap {
    background: #F5F5F5;
    border: 1px solid #D4D4D4;
    border-radius: 3px;
    height: 34px;
    position: relative;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .capacity-fill {
    height: 100%;
    background: #C8102E;
    transition: width 0.35s ease;
    position: relative;
  }
  .capacity-text {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 600;
    color: #2A1A0E;
  }
  .items-title {
    font-size: 11px; font-weight: 600; color: #545454;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .item-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }
  .item-swatch {
    width: 22px; height: 22px; border-radius: 3px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .item-info {
    flex: 1;
  }
  .item-name { font-size: 12px; font-weight: 700; color: #2A1A0E; }
  .item-detail { font-size: 11px; color: #545454; }
  .item-sliders { display: flex; flex-direction: column; gap: 2px; width: 160px; }
  .slider-row { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #545454; }
  .slider-row input[type=range] { width: 100px; accent-color: #2A1A0E; }
  .ratio-box {
    background: #FFF5F5;
    border: 1.5px solid #C8102E;
    border-radius: 4px;
    padding: 10px 14px;
    margin-top: 10px;
    margin-bottom: 10px;
  }
  .ratio-main {
    font-size: 22px; font-weight: 700; color: #C8102E;
  }
  .ratio-sub { font-size: 11px; color: #545454; margin-top: 2px; }
  .solution-row {
    font-size: 12px; color: #2A1A0E; margin-top: 6px; line-height: 1.6;
  }
  .sol-label { font-weight: 700; }
  .hairline { border: none; border-top: 1px solid #D4D4D4; margin: 10px 0; }
  .ctrl-title {
    font-size: 11px; font-weight: 600; color: #545454;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 6px; margin-top: 10px;
  }
  .ctrl-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .ctrl-row input[type=range] { width: 130px; accent-color: #2A1A0E; }
  .ctrl-row span { font-weight: 600; color: #2A1A0E; min-width: 36px; }
  .guarantee-wrap {
    margin-top: 10px;
  }
  .guarantee-label {
    font-size: 11px; color: #545454; margin-bottom: 4px;
  }
  .guarantee-outer {
    background: #F5F5F5;
    border: 1px solid #D4D4D4;
    border-radius: 3px;
    height: 24px;
    position: relative;
    overflow: hidden;
    width: 100%;
  }
  .guarantee-fill {
    height: 100%;
    background: #545454;
    transition: width 0.3s ease;
  }
  .guarantee-pct {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    font-size: 11px; font-weight: 600; color: #2A1A0E;
  }
  .chart-title { font-size: 12px; font-weight: 700; color: #2A1A0E; margin-bottom: 6px; }
  svg text { font-family: 'Montserrat', sans-serif; }
  .note { font-size: 10px; color: #545454; margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>
<h1>Greedy Knapsack: The 50% Guarantee</h1>
<div class="main-layout">
  <div class="left-panel">
    <div class="knapsack-label">Knapsack capacity: <span id="cap-display">1000</span></div>
    <div class="capacity-bar-wrap">
      <div class="capacity-fill" id="greedy-bar" style="width:0%"></div>
      <div class="capacity-text" id="greedy-cap-text">0 / 1000</div>
    </div>

    <div class="items-title">Items</div>
    <div id="items-container"></div>

    <hr class="hairline">
    <div class="ratio-box">
      <div class="ratio-main" id="ratio-display">Greedy/OPT = —%</div>
      <div class="ratio-sub" id="ratio-sub">Greedy: — &nbsp;|&nbsp; OPT: —</div>
    </div>
    <div class="solution-row" id="sol-greedy"></div>
    <div class="solution-row" id="sol-opt"></div>

    <hr class="hairline">
    <div class="ctrl-title">Controls</div>
    <div class="ctrl-row">
      <label>Capacity:</label>
      <input type="range" id="cap-slider" min="100" max="2000" value="1000">
      <span id="cap-val">1000</span>
    </div>
    <div class="ctrl-row">
      <label>Max item fraction f:</label>
      <input type="range" id="f-slider" min="0.01" max="0.5" step="0.01" value="0.5">
      <span id="f-val">0.50</span>
    </div>

    <div class="guarantee-wrap">
      <div class="guarantee-label">Theoretical guarantee: (1 − f) × OPT = <span id="guar-pct-label">50%</span></div>
      <div class="guarantee-outer">
        <div class="guarantee-fill" id="guar-bar" style="width:50%"></div>
        <div class="guarantee-pct" id="guar-pct">50%</div>
      </div>
    </div>
    <div class="note">At f = 0.1 → 90% guarantee &nbsp;|&nbsp; At f = 0.01 → 99% guarantee</div>
  </div>

  <div class="right-panel">
    <div class="chart-title">Value comparison</div>
    <svg id="bar-chart" width="300" height="200"></svg>
    <div class="chart-title" style="margin-top:14px">Items by value/weight ratio</div>
    <svg id="ratio-chart" width="300" height="160"></svg>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const COLORS_ITEM = ["#2A1A0E", "#545454", "#888888"];

let items = [
  { id: "A", value: 502, weight: 501 },
  { id: "B", value: 500, weight: 500 },
  { id: "C", value: 500, weight: 500 },
];
let capacity = 1000;
let fMax = 0.5;

// ── Greedy solver ────────────────────────────────────────────────────────────
function solveGreedy(items, cap) {
  const sorted = [...items].sort((a, b) => (b.value / b.weight) - (a.value / a.weight));
  let used = 0, val = 0, picked = [];
  for (const it of sorted) {
    if (used + it.weight <= cap) {
      used += it.weight;
      val  += it.value;
      picked.push(it.id);
    }
  }
  return { value: val, weight: used, picked };
}

// ── Optimal solver (brute force for ≤ 3 items) ──────────────────────────────
function solveOpt(items, cap) {
  const n = items.length;
  let best = 0, bestSet = [];
  for (let mask = 0; mask < (1 << n); mask++) {
    let w = 0, v = 0, s = [];
    for (let i = 0; i < n; i++) {
      if (mask & (1 << i)) { w += items[i].weight; v += items[i].value; s.push(items[i].id); }
    }
    if (w <= cap && v > best) { best = v; bestSet = s; }
  }
  return { value: best, picked: bestSet };
}

// ── Render items rows ────────────────────────────────────────────────────────
function renderItemRows() {
  const container = document.getElementById("items-container");
  container.innerHTML = "";
  items.forEach((item, idx) => {
    const row = document.createElement("div");
    row.className = "item-row";

    const swatch = document.createElement("div");
    swatch.className = "item-swatch";
    swatch.style.background = COLORS_ITEM[idx];
    swatch.textContent = item.id;
    row.appendChild(swatch);

    const info = document.createElement("div");
    info.className = "item-info";
    info.innerHTML = `<div class="item-name">Item ${item.id}</div>
      <div class="item-detail" id="detail-${item.id}">v=${item.value} | w=${item.weight} | v/w=${(item.value/item.weight).toFixed(4)}</div>`;
    row.appendChild(info);

    const sliders = document.createElement("div");
    sliders.className = "item-sliders";

    const vRow = document.createElement("div");
    vRow.className = "slider-row";
    vRow.innerHTML = `<span>val</span>
      <input type="range" min="1" max="1000" value="${item.value}" id="v-${item.id}">
      <span id="vv-${item.id}">${item.value}</span>`;
    sliders.appendChild(vRow);

    const wRow = document.createElement("div");
    wRow.className = "slider-row";
    wRow.innerHTML = `<span>wt</span>
      <input type="range" min="1" max="1000" value="${item.weight}" id="w-${item.id}">
      <span id="ww-${item.id}">${item.weight}</span>`;
    sliders.appendChild(wRow);

    row.appendChild(sliders);
    container.appendChild(row);

    // Attach events
    document.getElementById(`v-${item.id}`).addEventListener("input", e => {
      item.value = +e.target.value;
      document.getElementById(`vv-${item.id}`).textContent = item.value;
      update();
    });
    document.getElementById(`w-${item.id}`).addEventListener("input", e => {
      item.weight = +e.target.value;
      document.getElementById(`ww-${item.id}`).textContent = item.weight;
      update();
    });
  });
}

// ── Charts ───────────────────────────────────────────────────────────────────
const barSvg   = d3.select("#bar-chart");
const ratioSvg = d3.select("#ratio-chart");

function drawBarChart(greedyVal, optVal) {
  barSvg.selectAll("*").remove();
  const W = 300, H = 200, margin = { top: 10, right: 20, bottom: 30, left: 50 };
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;
  const g = barSvg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const data = [
    { label: "Greedy", value: greedyVal, color: "#C8102E" },
    { label: "OPT",    value: optVal,    color: "#2A1A0E" },
  ];

  const x = d3.scaleBand().domain(data.map(d => d.label)).range([0, w]).padding(0.4);
  const y = d3.scaleLinear().domain([0, Math.max(optVal, greedyVal) * 1.15]).range([h, 0]);

  g.append("g").attr("transform", `translate(0,${h})`)
    .call(d3.axisBottom(x).tickSize(0))
    .select(".domain").remove();
  g.selectAll(".tick text").style("font-size", "12px").style("font-family", "Montserrat");

  g.append("g")
    .call(d3.axisLeft(y).ticks(4))
    .selectAll("text").style("font-size", "10px").style("font-family", "Montserrat");

  g.selectAll(".bar")
    .data(data)
    .join("rect")
    .attr("class", "bar")
    .attr("x", d => x(d.label))
    .attr("y", d => y(d.value))
    .attr("width", x.bandwidth())
    .attr("height", d => h - y(d.value))
    .attr("fill", d => d.color)
    .attr("rx", 2);

  g.selectAll(".val-label")
    .data(data)
    .join("text")
    .attr("x", d => x(d.label) + x.bandwidth() / 2)
    .attr("y", d => y(d.value) - 4)
    .attr("text-anchor", "middle")
    .style("font-size", "11px").style("font-weight", "700")
    .style("font-family", "Montserrat").style("fill", d => d.color)
    .text(d => d.value);
}

function drawRatioChart() {
  ratioSvg.selectAll("*").remove();
  const W = 300, H = 160, margin = { top: 10, right: 20, bottom: 30, left: 50 };
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;
  const g = ratioSvg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const data = items.map((it, i) => ({
    label: it.id,
    ratio: it.weight > 0 ? it.value / it.weight : 0,
    color: COLORS_ITEM[i],
  })).sort((a, b) => b.ratio - a.ratio);

  const x = d3.scaleBand().domain(data.map(d => d.label)).range([0, w]).padding(0.4);
  const y = d3.scaleLinear().domain([0, d3.max(data, d => d.ratio) * 1.2]).range([h, 0]);

  g.append("g").attr("transform", `translate(0,${h})`)
    .call(d3.axisBottom(x).tickSize(0))
    .select(".domain").remove();
  g.selectAll(".tick text").style("font-size", "12px").style("font-family", "Montserrat");

  g.append("g")
    .call(d3.axisLeft(y).ticks(4).tickFormat(d3.format(".2f")))
    .selectAll("text").style("font-size", "10px").style("font-family", "Montserrat");

  g.selectAll(".tick line").style("stroke", "#D4D4D4");

  // Y-axis label
  g.append("text")
    .attr("transform", "rotate(-90)")
    .attr("x", -h / 2).attr("y", -38)
    .attr("text-anchor", "middle")
    .style("font-size", "10px").style("fill", "#545454")
    .style("font-family", "Montserrat")
    .text("value / weight");

  g.selectAll(".rbar")
    .data(data)
    .join("rect")
    .attr("class", "rbar")
    .attr("x", d => x(d.label))
    .attr("y", d => y(d.ratio))
    .attr("width", x.bandwidth())
    .attr("height", d => h - y(d.ratio))
    .attr("fill", d => d.color)
    .attr("rx", 2);

  g.selectAll(".rlabel")
    .data(data)
    .join("text")
    .attr("x", d => x(d.label) + x.bandwidth() / 2)
    .attr("y", d => y(d.ratio) - 4)
    .attr("text-anchor", "middle")
    .style("font-size", "10px").style("font-weight", "700")
    .style("font-family", "Montserrat").style("fill", d => d.color)
    .text(d => d.ratio.toFixed(3));
}

// ── Main update ──────────────────────────────────────────────────────────────
function update() {
  const greedy = solveGreedy(items, capacity);
  const opt    = solveOpt(items, capacity);
  const ratio  = opt.value > 0 ? (greedy.value / opt.value) : 1;

  // Capacity bar
  const pct = capacity > 0 ? Math.min(greedy.weight / capacity, 1) * 100 : 0;
  document.getElementById("greedy-bar").style.width = pct + "%";
  document.getElementById("greedy-cap-text").textContent =
    `${greedy.weight} / ${capacity}`;
  document.getElementById("cap-display").textContent = capacity;

  // Ratio
  document.getElementById("ratio-display").textContent =
    `Greedy/OPT = ${(ratio * 100).toFixed(1)}%`;
  document.getElementById("ratio-sub").textContent =
    `Greedy: ${greedy.value}  |  OPT: ${opt.value}`;

  // Solution rows
  document.getElementById("sol-greedy").innerHTML =
    `<span class="sol-label" style="color:#C8102E">Greedy picks:</span> ${greedy.picked.length ? greedy.picked.join(", ") : "none"} (value ${greedy.value}, weight ${greedy.weight})`;
  document.getElementById("sol-opt").innerHTML =
    `<span class="sol-label">OPT picks:</span> ${opt.picked.length ? opt.picked.join(", ") : "none"} (value ${opt.value})`;

  // Item detail rows
  items.forEach(it => {
    const el = document.getElementById(`detail-${it.id}`);
    if (el) el.textContent = `v=${it.value} | w=${it.weight} | v/w=${(it.value/it.weight).toFixed(4)}`;
  });

  // Guarantee bar
  const guarPct = Math.max(0, Math.min(1, 1 - fMax));
  document.getElementById("guar-bar").style.width = (guarPct * 100) + "%";
  document.getElementById("guar-pct").textContent = `${(guarPct * 100).toFixed(0)}%`;
  document.getElementById("guar-pct-label").textContent = `${(guarPct * 100).toFixed(0)}%`;

  drawBarChart(greedy.value, opt.value);
  drawRatioChart();
}

// ── Controls ─────────────────────────────────────────────────────────────────
document.getElementById("cap-slider").addEventListener("input", e => {
  capacity = +e.target.value;
  document.getElementById("cap-val").textContent = capacity;
  update();
});
document.getElementById("f-slider").addEventListener("input", e => {
  fMax = +e.target.value;
  document.getElementById("f-val").textContent = fMax.toFixed(2);
  update();
});

// ── Init ─────────────────────────────────────────────────────────────────────
renderItemRows();
update();
</script>
</body>
</html>
