<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uncertainty Hyperbola — σₓ × σₚ ≥ ℏ/2</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fff;
    color: #2A1A0E;
    font-family: 'Inter', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
  .subtitle { font-size: 0.88rem; color: #545454; margin-bottom: 20px; }
  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ctrl-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  label { font-size: 0.78rem; color: #545454; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  input[type=range] { width: 200px; accent-color: #C8102E; }
  .val-display { font-size: 0.82rem; color: #2A1A0E; font-weight: 700; }
  .readout {
    font-size: 0.88rem;
    background: #f8f8f8;
    border-left: 3px solid #C8102E;
    padding: 8px 14px;
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .readout span { font-weight: 700; color: #C8102E; }
  .toggle-group { display: flex; gap: 8px; }
  .toggle-btn {
    padding: 4px 12px;
    font-size: 0.78rem;
    border: 1.5px solid #2A1A0E;
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    border-radius: 2px;
  }
  .toggle-btn.active { background: #2A1A0E; color: #fff; }
  .charts { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  svg text { font-family: 'Inter', Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<h1>Uncertainty Hyperbola</h1>
<div class="subtitle">σₓ × σₚ ≥ ℏ/2 — squeeze position, momentum explodes. The bound is geometry, not disturbance.</div>

<div class="controls">
  <div class="ctrl-group">
    <label>Width parameter <i>a</i> (nm)</label>
    <input type="range" id="a-slider" min="0.2" max="4.0" step="0.02" value="1.0">
    <span class="val-display" id="a-val">a = 1.00 nm</span>
  </div>
  <div class="ctrl-group">
    <label>State overlay</label>
    <div class="toggle-group">
      <button class="toggle-btn active" data-state="gaussian" onclick="setStateOverlay(this)">Gaussian</button>
      <button class="toggle-btn" data-state="isw1" onclick="setStateOverlay(this)">ISW n=1</button>
      <button class="toggle-btn" data-state="isw5" onclick="setStateOverlay(this)">ISW n=5</button>
    </div>
  </div>
</div>

<div class="readout">
  <div>a = <span id="ra">1.00</span> nm</div>
  <div>σₓ = <span id="rx">0.707</span> nm</div>
  <div>σₚ = <span id="rp">0.465</span> eV/c</div>
  <div>σₓσₚ/(ℏ/2) = <span id="rratio">1.000</span></div>
</div>

<div class="charts">
  <svg id="waveform" width="300" height="280"></svg>
  <svg id="hyperbola" width="380" height="280"></svg>
</div>

<script>
const INK = '#2A1A0E';
const RED = '#C8102E';
const SLATE = '#545454';
// ħ = 0.6582 eV·fs; 1 nm·eV/c = ħ·c / (c·nm) ... let's use natural units with ħ=0.6582 eV·fs
// For Gaussian: σ_x = a/√2 (nm), σ_p = ħ/(√2·a) (eV·fs/nm = eV/(nm/fs) ≈ eV/c * factor)
// The product: σ_x · σ_p = (a/√2) · ħ/(√2·a) = ħ/2  ✓
// We'll display σ_p in units of ħ/nm (= ħ·nm⁻¹) so σ_p = 1/(√2·a) in these units
// Then product = σ_x·σ_p = a/√2 · 1/(√2·a) = 1/2 in units of ħ
const HBAR_EVfs = 0.6582; // eV·fs
// We'll work in nm for σ_x; σ_p in ħ/nm units (so ħ/2 = 0.5 ħ)
// Display σ_p in eV·fs/nm = eV/THz ... shown normalized

let aVal = 1.0;
let stateOverlay = 'gaussian';

function getSigX(a) { return a / Math.SQRT2; }  // nm
function getSigP(a) { return 1.0 / (Math.SQRT2 * a); } // units of ħ/nm
function getProduct(a) { return getSigX(a) * getSigP(a); } // = 0.5 ħ always

// ISW ground state for L = a·√(2) (so σ_x matches the Gaussian σ_x = a/√2 at same a)
// Actually let's just use fixed ISW state with L=1nm
// ISW n=1, L=1nm: σ_x = L√((π²-6)/(12π²)) = √((π²-6)/(12π²)) nm
// σ_p = πħ/L = π ħ/nm → in ħ/nm units: π
const L_isw = 1.0; // nm
const iswSigX1 = L_isw * Math.sqrt((Math.PI*Math.PI - 6) / (12 * Math.PI * Math.PI));
const iswSigP1 = Math.PI;
const iswRatio1 = iswSigX1 * iswSigP1 / 0.5;

// ISW n=5, L=1nm: σ_x and σ_p
// ⟨x²⟩_{n=5} = L²(1/3 - 1/(2·25·π²)) = L²(1/3 - 1/(50π²))
// σ_x² = ⟨x²⟩ - (L/2)² = L²[(1/3 - 1/(50π²)) - 1/4] = L²[1/12 - 1/(50π²)]
// σ_p = 5πħ/L (in ħ/nm: 5π)
const iswSigX5 = L_isw * Math.sqrt(1/12 - 1/(50 * Math.PI * Math.PI));
const iswSigP5 = 5 * Math.PI;
const iswRatio5 = iswSigX5 * iswSigP5 / 0.5;

// ── Waveform panel ──────────────────────────────────────────────────────────
const wSvg = d3.select('#waveform');
const wW = 300, wH = 280;
const wM = {top: 28, right: 18, bottom: 48, left: 48};
const wIW = wW - wM.left - wM.right, wIH = wH - wM.top - wM.bottom;
const wG = wSvg.append('g').attr('transform', `translate(${wM.left},${wM.top})`);

const xExt = [-5, 5]; // nm
const wX = d3.scaleLinear().domain(xExt).range([0, wIW]);
const wY = d3.scaleLinear().domain([0, 1]).range([wIH, 0]);

const wXAxis = wG.append('g').attr('class', 'x-axis').attr('transform', `translate(0,${wIH})`).call(d3.axisBottom(wX).ticks(5));
wG.append('g').call(d3.axisLeft(wY).ticks(4).tickFormat(d3.format('.2f')));

wG.append('text').attr('x', wIW/2).attr('y', -10).attr('text-anchor', 'middle').attr('font-size', '12px').attr('font-weight', '700').attr('fill', INK).text('Position density |ψ(x)|²');
wG.append('text').attr('x', wIW/2).attr('y', wIH + 38).attr('text-anchor', 'middle').attr('font-size', '11px').attr('fill', SLATE).text('x (nm)');

const wPath = wG.append('path').attr('fill', 'none').attr('stroke', RED).attr('stroke-width', 2.5);
const wLine = d3.line().x(d => wX(d.x)).y(d => wY(d.y)).curve(d3.curveBasis);

function gaussianPsi2(x, sx) {
  return (1 / (Math.sqrt(2 * Math.PI) * sx)) * Math.exp(-x*x / (2*sx*sx));
}

function iswPsi2(x, n, L) {
  if (x < 0 || x > L) return 0;
  return (2/L) * Math.pow(Math.sin(n * Math.PI * x / L), 2);
}

function updateWaveform() {
  const sx = getSigX(aVal);
  const nPts = 300;
  let data;
  if (stateOverlay === 'gaussian') {
    data = d3.range(nPts).map(i => {
      const x = xExt[0] + (xExt[1]-xExt[0]) * i/(nPts-1);
      return { x, y: gaussianPsi2(x, sx) };
    });
    const peak = gaussianPsi2(0, sx);
    wY.domain([0, peak * 1.15]);
  } else if (stateOverlay === 'isw1') {
    data = d3.range(nPts).map(i => {
      const x = -0.5 + 1.5 * i/(nPts-1);
      return { x, y: iswPsi2(x, 1, L_isw) };
    });
    wY.domain([0, 2.5]);
    wX.domain([-0.2, 1.2]);
  } else {
    data = d3.range(nPts).map(i => {
      const x = -0.1 + 1.2 * i/(nPts-1);
      return { x, y: iswPsi2(x, 5, L_isw) };
    });
    wY.domain([0, 2.5]);
    wX.domain([-0.2, 1.2]);
  }
  if (stateOverlay === 'gaussian') wX.domain(xExt);
  wXAxis.call(d3.axisBottom(wX).ticks(5));
  wPath.datum(data).attr('d', wLine);
}

// ── Hyperbola panel ──────────────────────────────────────────────────────────
const hSvg = d3.select('#hyperbola');
const hW = 380, hH = 280;
const hM = {top: 28, right: 24, bottom: 52, left: 60};
const hIW = hW - hM.left - hM.right, hIH = hH - hM.top - hM.bottom;
const hG = hSvg.append('g').attr('transform', `translate(${hM.left},${hM.top})`);

const hXScale = d3.scaleLog().domain([0.1, 5]).range([0, hIW]);
const hYScale = d3.scaleLog().domain([0.15, 20]).range([hIH, 0]);

hG.append('g').attr('transform', `translate(0,${hIH})`).call(d3.axisBottom(hXScale).ticks(5, '.1f'));
hG.append('g').call(d3.axisLeft(hYScale).ticks(5, '.1f'));
hG.append('text').attr('x', hIW/2).attr('y', -10).attr('text-anchor', 'middle').attr('font-size', '12px').attr('font-weight', '700').attr('fill', INK).text('σₓ–σₚ Hyperbola (log–log)');
hG.append('text').attr('x', hIW/2).attr('y', hIH + 40).attr('text-anchor', 'middle').attr('font-size', '11px').attr('fill', SLATE).text('σₓ (nm)');
hG.append('text').attr('transform', 'rotate(-90)').attr('x', -hIH/2).attr('y', -46).attr('text-anchor', 'middle').attr('font-size', '11px').attr('fill', SLATE).text('σₚ (ħ/nm)');

// Hyperbola σ_p = 0.5/σ_x (product = ħ/2 = 0.5 in these units)
const hData = d3.range(200).map(i => {
  const sx = Math.exp(Math.log(0.1) + Math.log(50) * i/199);
  return { sx, sp: 0.5/sx };
}).filter(d => d.sp >= 0.15 && d.sp <= 20);

hG.append('path').datum(hData).attr('fill','none').attr('stroke',INK).attr('stroke-width',1.5)
  .attr('d', d3.line().x(d=>hXScale(d.sx)).y(d=>hYScale(d.sp)));

hG.append('text').attr('x', hXScale(0.6)).attr('y', hYScale(0.5/0.6)-8).attr('font-size','10px').attr('fill',SLATE).text('σₓσₚ = ħ/2');

// ISW n=1 fixed marker
hG.append('circle').attr('cx', hXScale(iswSigX1)).attr('cy', hYScale(iswSigP1)).attr('r', 6)
  .attr('fill','none').attr('stroke',SLATE).attr('stroke-width',2).attr('stroke-dasharray','3,2');
hG.append('text').attr('x', hXScale(iswSigX1)+8).attr('y', hYScale(iswSigP1)-4).attr('font-size','9px').attr('fill',SLATE).text(`ISW n=1 (×${iswRatio1.toFixed(3)})`);

// ISW n=5 fixed marker
hG.append('circle').attr('cx', hXScale(iswSigX5)).attr('cy', hYScale(iswSigP5)).attr('r', 5)
  .attr('fill','none').attr('stroke',SLATE).attr('stroke-width',1.5).attr('stroke-dasharray','3,2');
hG.append('text').attr('x', hXScale(iswSigX5)+7).attr('y', hYScale(iswSigP5)+4).attr('font-size','9px').attr('fill',SLATE).text(`ISW n=5 (×${iswRatio5.toFixed(2)})`);

// Moving point
const movingDot = hG.append('circle').attr('r', 7).attr('fill', RED).attr('stroke','white').attr('stroke-width',1.5);

function updateHyperbola() {
  let sx, sp;
  if (stateOverlay === 'gaussian') {
    sx = getSigX(aVal);
    sp = getSigP(aVal);
  } else if (stateOverlay === 'isw1') {
    sx = iswSigX1; sp = iswSigP1;
  } else {
    sx = iswSigX5; sp = iswSigP5;
  }
  movingDot.attr('cx', hXScale(Math.max(0.1, Math.min(5, sx)))).attr('cy', hYScale(Math.max(0.15, Math.min(20, sp))));
}

// ── Controls ─────────────────────────────────────────────────────────────────
function updateReadout() {
  let sx, sp, ratio;
  if (stateOverlay === 'gaussian') {
    sx = getSigX(aVal); sp = getSigP(aVal); ratio = 1.000;
  } else if (stateOverlay === 'isw1') {
    sx = iswSigX1; sp = iswSigP1; ratio = iswRatio1;
  } else {
    sx = iswSigX5; sp = iswSigP5; ratio = iswRatio5;
  }
  document.getElementById('ra').textContent = aVal.toFixed(2);
  document.getElementById('rx').textContent = sx.toFixed(3);
  document.getElementById('rp').textContent = sp.toFixed(3);
  document.getElementById('rratio').textContent = ratio.toFixed(3);
}

document.getElementById('a-slider').addEventListener('input', e => {
  aVal = parseFloat(e.target.value);
  document.getElementById('a-val').textContent = `a = ${aVal.toFixed(2)} nm`;
  updateWaveform();
  updateHyperbola();
  updateReadout();
});

function setStateOverlay(btn) {
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  stateOverlay = btn.dataset.state;
  updateWaveform();
  updateHyperbola();
  updateReadout();
}

// Initial render
updateWaveform();
updateHyperbola();
updateReadout();

// Testable predictions
console.assert(Math.abs(getSigX(1)*getSigP(1) - 0.5) < 1e-10, 'P1: Gaussian at a=1 → σₓσₚ = 0.5 = ħ/2 ✓');
console.assert(Math.abs(iswRatio1 - 1.136) < 0.002, `P2: ISW n=1 ratio ≈ 1.136, got ${iswRatio1.toFixed(4)}`);
console.log(`✓ P1: Gaussian σₓσₚ = ${(getSigX(1)*getSigP(1)).toFixed(6)} = ħ/2`);
console.log(`✓ P2: ISW n=1 ratio = ${iswRatio1.toFixed(4)} ≈ 1.136`);
console.log(`  ISW n=5 ratio = ${iswRatio5.toFixed(3)}`);
</script>
</body>
</html>
