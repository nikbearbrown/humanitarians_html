name: Timesheets regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  timesheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Synthetic in-memory PostgreSQL only; no database secrets are used.
      - run: npm run test:timesheets
      - run: npm run typecheck:timesheets
      # Real UI + real API handlers in headless Chrome (preinstalled on the runner).
      - run: npm run test:timesheets:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timesheet-screenshots
          path: docs/timesheets/screenshots
